[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-position-hmi"
version = "0.27.0"
description = "Pole Position — ISA-101-aligned configurable battery inspection HMI"
readme = "README.md"
requires-python = ">=3.11"
# Proprietary. The table form is used rather than a PEP 639 SPDX string so the
# metadata stays valid for the whole declared setuptools>=69 range.
license = { file = "LICENSE" }
classifiers = [
  "License :: Other/Proprietary License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PySide6>=6.7,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
hardware = [
  "pypylon>=3.0",
  "pycomm3>=1.2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<0.17",
]
training = [
  "ultralytics>=8.3,<9",
  "onnx>=1.16,<2",
]

[project.scripts]
pole-position = "battery_inspector.main:main"
# Retain the original launcher alias for existing station shortcuts.
battery-inspector = "battery_inspector.main:main"

[tool.setuptools.packages.find]
include = ["battery_inspector*"]

[tool.setuptools.package-data]
battery_inspector = ["assets/*", "ui/*.qss", "_git_archival.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

# Selected explicitly so the enforced rule set is a project decision rather than
# a function of whichever Ruff release the CI runner happens to resolve. Ruff has
# widened its implicit defaults across releases; without this block a routine
# toolchain refresh turns CI red on rules the project never opted into.
[tool.ruff.lint]
# S110/S112 are enforced so a new silent `except: pass` cannot enter a
# fail-closed inspection application unexamined. All 20 existing sites were
# audited and carry a noqa naming why swallowing is correct there -- almost
# all are best-effort teardown of a resource already being abandoned, or
# probing alternative GenICam names where absence is the expected result.
# S608 is free: both dynamic-SQL sites are already annotated.
#
# BLE001 (blind except) is deliberately not enabled yet. The code already
# annotates its intentional blind excepts, but 40 further sites would need
# review first, which is its own change rather than part of this audit.
# RUF100 waits on that, since it would demand deleting those annotations
# while the rule that justifies them is still off.
select = ["E4", "E7", "E9", "F", "S110", "S112", "S608"]
