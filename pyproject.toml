[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-position-hmi"
version = "0.23.4"
description = "Pole Position — ISA-101-aligned configurable battery inspection HMI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
hardware = [
  "pypylon>=3.0",
  "pycomm3>=1.2",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
training = [
  "ultralytics>=8.3,<9",
  "onnx>=1.16,<2",
]

[project.scripts]
pole-position = "battery_inspector.main:main"
# Retain the original launcher alias for existing station shortcuts.
battery-inspector = "battery_inspector.main:main"

[tool.setuptools.packages.find]
include = ["battery_inspector*"]

[tool.setuptools.package-data]
battery_inspector = ["assets/*", "ui/*.qss", "_git_archival.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
