name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pole Position ships as a Windows x64 station application, so the suite has
    # to run on Windows and not only on the Linux runner that is cheaper. The
    # full offline installer cannot be built here -- build-installer.ps1
    # requires the licensed Basler pylon Runtime Redistributable and verifies
    # its Authenticode signature -- so this job covers the application, and the
    # installer remains a controlled local build per docs/WINDOWS_INSTALLER.md.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result. A Windows-only failure must not be
      # hidden by a Linux failure, or the reverse.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip

      - name: Install Qt runtime libraries for the headless HMI tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run bundled vision regression
        run: python scripts/vision_smoke_test.py

      - name: Run terminal-head rotation regression
        run: python scripts/stamp_rotation_smoke_test.py

      - name: Run conditional terminal-top regression
        run: python scripts/terminal_top_gate_smoke_test.py

      - name: Verify tracked-source checksum manifest
        # Linux only. The manifest records the bytes as committed, and Git for
        # Windows checks text files out with CRLF line endings, so the digests
        # would not match a Windows working tree. One verification per CI run
        # is what the manifest is for.
        if: runner.os == 'Linux'
        run: python scripts/verify_source_checksums.py

      - name: Run Ruff
        # Lint results are platform-independent; once per Python version is enough.
        if: runner.os == 'Linux'
        run: python -m ruff check battery_inspector scripts tests
