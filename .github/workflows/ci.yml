name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run bundled vision regression
        run: python scripts/vision_smoke_test.py

      - name: Run terminal-head rotation regression
        run: python scripts/stamp_rotation_smoke_test.py

      - name: Run conditional terminal-top regression
        run: python scripts/terminal_top_gate_smoke_test.py

      - name: Run Ruff
        run: python -m ruff check battery_inspector scripts tests
